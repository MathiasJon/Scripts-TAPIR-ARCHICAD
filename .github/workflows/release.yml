name: Package & release Context Generator

# Se déclenche en poussant un tag "v*" (ex: v1.0, v1.1) — construit un ZIP
# contenant uniquement les fichiers essentiels de SCRIPTS/CONTEXT GENERATOR/
# et le publie comme asset attaché à une Release GitHub.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          set -e
          SRC="SCRIPTS/CONTEXT GENERATOR"
          PKG="cadastre-tool"
          mkdir -p "$PKG/app/frontend"

          # À la racine du paquet : seulement les deux lanceurs (+ INSTALLER.txt).
          # Tout le reste (serveur, frontend, requirements) dans « app/ ».
          cp "$SRC/app/server.py"           "$PKG/app/"
          cp "$SRC/app/requirements.txt"    "$PKG/app/"
          cp "$SRC/app/frontend/index.html" "$PKG/app/frontend/"
          cp "$SRC/lancer sous mac os.command" "$PKG/"
          cp "$SRC/lancer sous windows.bat"    "$PKG/"
          cp "$SRC/lanceur alternatif.py"      "$PKG/"
          chmod +x "$PKG/lancer sous mac os.command"

          # Le runner est Linux : le fichier source est en LF. Un .bat Windows a
          # besoin de CRLF (un .bat en LF pur peut faire fermer cmd.exe aussitôt
          # au double-clic, sans rien exécuter — constaté en v1.4).
          sed -i 's/$/\r/' "$PKG/lancer sous windows.bat"

          cat > "$PKG/INSTALLER.txt" << 'EOF'
          CADASTRE TOOL — Installation
          ==============================

          À la racine : les lanceurs. Tout le reste est dans le dossier « app ».
          Au 1er lancement, l'outil installe ses dépendances Python (1-2 min).
          L'interface s'ouvre ensuite sur http://localhost:5057

          MACOS
          ------
          - Double-clic sur « lancer sous mac os.command »
          - Si macOS bloque : clic-droit → Ouvrir → Ouvrir quand même.
            Sur macOS 15+, si ça ne suffit pas :
            Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ».

          WINDOWS
          --------
          - Double-clic sur « lancer sous windows.bat »

          SI RIEN NE MARCHE (fichier en quarantaine, blocage antivirus…)
          -------------------------------------------------------------
          Utilisez « lanceur alternatif.py » (même résultat, tous systèmes) :
          - clic-droit → Ouvrir avec → IDLE, puis menu  Run > Run Module  (F5)
          - OU dans un terminal, depuis ce dossier :
              python3 "lanceur alternatif.py"   (Windows :  py "lanceur alternatif.py")
          Un .py lancé depuis IDLE ou le terminal ne déclenche pas Gatekeeper.

          Autre option : récupérer le dossier via le disque partagé ou « git clone »
          (les fichiers ne sont alors jamais mis en quarantaine).

          PRÉ-REQUIS
          -----------
          Python 3.10 ou supérieur — https://www.python.org
          macOS : via https://www.python.org (fournit aussi IDLE) ou `brew install python3`
          Windows : cocher "Add Python to PATH" lors de l'installation
          EOF

          # Nom de fichier fixe (pas versionné) : permet un lien stable
          # via .../releases/latest/download/cadastre-tool.zip
          zip -r "cadastre-tool.zip" "$PKG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cadastre-tool.zip
          generate_release_notes: true
